<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Background circle -->
  <circle cx="24" cy="24" r="23" fill="#1b1d22" stroke="#f2a93b" stroke-width="2"/>
  <!-- Amber glow ring -->
  <circle cx="24" cy="24" r="23" fill="none" stroke="#f2a93b" stroke-width="1.5" opacity="0.4"/>
  <!-- Owl body -->
  <ellipse cx="24" cy="27" rx="10" ry="11" fill="#f2a93b"/>
  <!-- Owl belly -->
  <ellipse cx="24" cy="30" rx="6" ry="7" fill="#fcd97a"/>
  <!-- Left eye -->
  <circle cx="20" cy="22" r="4" fill="#1b1d22"/>
  <circle cx="20" cy="22" r="2.5" fill="#fff"/>
  <circle cx="20.8" cy="21.5" r="1.2" fill="#1b1d22"/>
  <!-- Right eye -->
  <circle cx="28" cy="22" r="4" fill="#1b1d22"/>
  <circle cx="28" cy="22" r="2.5" fill="#fff"/>
  <circle cx="28.8" cy="21.5" r="1.2" fill="#1b1d22"/>
  <!-- Beak -->
  <polygon points="24,25 22,27 26,27" fill="#e8850a"/>
  <!-- Left ear tuft -->
  <polygon points="17,17 15,11 20,15" fill="#f2a93b"/>
  <!-- Right ear tuft -->
  <polygon points="31,17 33,11 28,15" fill="#f2a93b"/>
  <!-- Wings -->
  <ellipse cx="14.5" cy="30" rx="4" ry="7" fill="#e8850a" transform="rotate(-15 14.5 30)"/>
  <ellipse cx="33.5" cy="30" rx="4" ry="7" fill="#e8850a" transform="rotate(15 33.5 30)"/>
</svg>
